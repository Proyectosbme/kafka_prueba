quarkus.http.port=9090

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/qurakuskafka
quarkus.datasource.jdbc.schema=kafka
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file



quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=Content-Type
quarkus.http.cors.methods=GET,POST,PUT,DELETE


# Dirección del broker Kafka
kafka.bootstrap.servers=localhost:9092

# Canal para mensajes de texto
mp.messaging.outgoing.turno-solicitado.connector=smallrye-kafka
mp.messaging.outgoing.turno-solicitado.topic=turno-solicitado
mp.messaging.outgoing.turno-solicitado.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Canal para objetos JSON-B
mp.messaging.outgoing.turno-solicitado2.connector=smallrye-kafka
mp.messaging.outgoing.turno-solicitado2.topic=turno-solicitado2
mp.messaging.outgoing.turno-solicitado2.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer


mp.messaging.outgoing.notificaciones-turno.connector=smallrye-kafka
mp.messaging.outgoing.notificaciones-turno.topic=notificaciones-turno
mp.messaging.outgoing.notificaciones-turno.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.log.level=INFO
quarkus.log.console.level=DEBUG
quarkus.log.category."org.acme".level=TRACE



